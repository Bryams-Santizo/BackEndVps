# =========================
# APP
# =========================
spring.application.name=proyecto-cafe

# =========================
# DB (PostgreSQL en el mismo VPS)
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/ADICAM
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

# Si usas data.sql / schema.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# =========================
# LOGGING (producción)
# =========================
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO

# =========================
# SERVER (solo local porque Nginx hace proxy)
# =========================
server.address=127.0.0.1
server.port=8080

# =========================
# FRONTEND (IMPORTANTE EN PROD)
# =========================
frontend.origin=https://adicam.cloud

# =========================
# UPLOADS / MEDIA (data fuera del código)
# =========================
file.upload-dir=/opt/proyecto-cafe-data/uploads
media.storage-path=/opt/proyecto-cafe-data/uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =========================
# JWT (una sola vez)
# =========================
jwt.secret=superSecretKeyForCafeSystem12345
jwt.expiration-ms=3600000

